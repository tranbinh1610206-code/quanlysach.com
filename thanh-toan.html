<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán - BookStore</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container header-inner">
            <div class="logo"><h1>Book<span>Store</span></h1></div>
            <nav>
                <ul>
                    <li><a href="index.html">Trang chủ</a></li>
                    <li><a href="gio-hang.html">Giỏ hàng</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <h2 class="section-title">Thông Tin Thanh Toán</h2>
        <div class="form-container">
            <form action="thanh-cong.html">
                <div class="form-group">
                    <label>Họ và tên</label>
                    <input type="text" required placeholder="Nhập họ và tên">
                </div>
                <div class="form-group">
                    <label>Số điện thoại</label>
                    <input type="text" required placeholder="Nhập số điện thoại">
                </div>
                <div class="form-group">
                    <label>Địa chỉ giao hàng</label>
                    <input type="text" required placeholder="Nhập địa chỉ">
                </div>
                <button type="submit" class="btn" style="width: 100%;">Xác nhận đặt hàng</button>
            </form>
        </div>
    </main>

    <footer>
        <div class="container"><p>&copy; 2024 BookStore.</p></div>
    </footer>
</body>
</html>
