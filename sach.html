<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tủ sách - BookStore</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container header-inner">
            <div class="logo"><h1>Book<span>Store</span></h1></div>
            <nav>
                <ul>
                    <li><a href="index.html">Trang chủ</a></li>
                    <li><a href="danh-muc.html">Danh mục</a></li>
                    <li><a href="sach.html">Tủ sách</a></li>
                    <li><a href="gio-hang.html">Giỏ hàng</a></li>
                    <li><a href="dang-nhap.html">Đăng nhập</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <h2 class="section-title">Tất Cả Sách</h2>
        <div class="book-grid">
            <article class="card">
                <img src="https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&w=400&q=80" alt="Sách">
                <div class="card-content">
                    <h3 class="card-title">Tuổi Trẻ Đáng Giá Bao Nhiêu</h3>
                    <p class="card-price">75.000 đ</p>
                    <a href="chi-tiet.html" class="btn">Xem chi tiết</a>
                </div>
            </article>
            <article class="card">
                <img src="https://images.unsplash.com/photo-1544947950-fa07a98d237f?auto=format&fit=crop&w=400&q=80" alt="Sách">
                <div class="card-content">
                    <h3 class="card-title">Đắc Nhân Tâm</h3>
                    <p class="card-price">85.000 đ</p>
                    <a href="chi-tiet.html" class="btn">Xem chi tiết</a>
                </div>
            </article>
        </div>
    </main>

    <footer>
        <div class="container"><p>&copy; 2024 BookStore. Sinh viên thực hiện: Nguyễn Văn A.</p></div>
    </footer>
</body>
</html>
