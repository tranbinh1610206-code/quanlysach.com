<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - BookStore</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container header-inner">
            <div class="logo"><h1>Book<span>Store</span></h1></div>
            <nav>
                <ul>
                    <li><a href="index.html">Trang chủ</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <h2 class="section-title">Đăng Nhập</h2>
        <div class="form-container">
            <form action="index.html">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" required placeholder="Nhập email">
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" required placeholder="Nhập mật khẩu">
                </div>
                <button type="submit" class="btn" style="width: 100%;">Đăng nhập</button>
            </form>
        </div>
    </main>

    <footer>
        <div class="container"><p>&copy; 2024 BookStore.</p></div>
    </footer>
</body>
</html>
